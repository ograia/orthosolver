name: Update repo on VM when dev changes

on:
  push:
    branches:
      - dev

concurrency:
  group: update-dev-vm
  cancel-in-progress: true

jobs:
  update:
    runs-on: [self-hosted, linux, x64, lean-compiled-engine]

    steps:
      - name: Update /opt/compiled-lean-engine to latest dev
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/compiled-lean-engine
          git fetch origin dev
          git checkout dev
          git reset --hard origin/dev
