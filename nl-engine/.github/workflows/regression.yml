name: Regression and Evaluator

on:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  regression-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run regression suite
        run: pytest -q -m regression

  evaluator-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Start mock Lean + API
        run: |
          uvicorn mock_lean.main:app --host 0.0.0.0 --port 8081 &
          uvicorn nl_engine.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
      - name: Run evaluator
        env:
          RUN_EVALUATOR: "1"
          EVAL_API_BASE_URL: "http://localhost:8000"
          EVAL_CASES_PATH: "tools/evaluator/cases.sample.json"
        run: scripts/run_regression.sh
      - name: Upload evaluator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-results
          path: |
            eval_results.json
            eval_results.md
