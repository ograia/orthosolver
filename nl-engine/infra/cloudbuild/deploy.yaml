steps:
  - id: "Run SQL migrations"
    name: "migrate/migrate:v4.17.1"
    entrypoint: "sh"
    args:
      - "-c"
      - >
        migrate -path database/migrations
        -database "$$DATABASE_URL"
        up

  - id: "Deploy orchestrator"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "sh"
    args:
      - "-c"
      - >
        gcloud run deploy orthos-orchestrator
        --project "$PROJECT_ID"
        --region "$_REGION"
        --image "$_ORCHESTRATOR_IMAGE"
        --platform managed

  - id: "Deploy workers"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "sh"
    args:
      - "-c"
      - >
        for svc in decomposition-worker decomposition-vetter-worker lemma-solver-worker lemma-vetter-worker; do
          gcloud run deploy "orthos-$$svc" --project "$PROJECT_ID" --region "$_REGION" --image "$_WORKER_IMAGE" --platform managed;
        done

substitutions:
  _REGION: "us-east1"
  _ORCHESTRATOR_IMAGE: "gcr.io/$PROJECT_ID/orthos-orchestrator:latest"
  _WORKER_IMAGE: "gcr.io/$PROJECT_ID/orthos-worker:latest"

options:
  logging: CLOUD_LOGGING_ONLY
